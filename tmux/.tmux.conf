# Core settings
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",alacritty:RGB"
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix
set -g escape-time 0
set -g focus-events on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Enable mouse support
set -g mouse on

# Set vi-mode for copy mode
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# Catppuccin theme (Mocha)
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @catppuccin_flavour 'mocha'

# Configure tmux-prefix-highlight
set -g status-right '#{prefix_highlight} | %a %Y-%m-%d %H:%M'
set -g @prefix_highlight_fg 'black'
set -g @prefix_highlight_bg 'white'

# Session persistence
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

# Clipboard
set -g @plugin 'tmux-plugins/tmux-yank'

# Session management
set -g @plugin 'tmux-plugins/tmux-sessionist'

# Smart pane switching with awareness of Neovim
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+.*(n?vim|ssh|tmux)$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Pane resize (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Splits
bind _ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Claude layout: claude (left) + nvim (right top) + shell (right bottom)
bind W run-shell 'DIR="#{pane_current_path}"; \
    tmux new-window -n "$(basename "$DIR")" -c "$DIR" && \
    tmux send-keys "claude" C-m && \
    tmux split-window -h -p 45 -c "$DIR" && \
    tmux send-keys "nvim" C-m && \
    tmux split-window -v -p 40 -c "$DIR" && \
    tmux select-pane -t 0 || true'

# Opencode layout: claude (left) + two terminals (right)
bind O run-shell 'DIR="#{pane_current_path}"; \
    tmux new-window -n "$(basename "$DIR")" -c "$DIR" && \
    tmux send-keys "opencode" C-m && \
    tmux split-window -h -p 45 -c "$DIR" && \
    tmux send-keys "nvim" C-m && \
    tmux split-window -v -p 50 -c "$DIR" && \
    tmux select-pane -t 0 || true'

# Codex layout: claude (left) + two terminals (right)
bind C run-shell 'DIR="#{pane_current_path}"; \
    tmux new-window -n "$(basename "$DIR")" -c "$DIR" && \
    tmux send-keys "codex" C-m && \
    tmux split-window -h -p 45 -c "$DIR" && \
    tmux send-keys "nvim" C-m && \
    tmux split-window -v -p 50 -c "$DIR" && \
    tmux select-pane -t 0 || true'

# Gemini layout: claude (left) + two terminals (right)
bind G run-shell 'DIR="#{pane_current_path}"; \
    tmux new-window -n "$(basename "$DIR")" -c "$DIR" && \
    tmux send-keys "gemini" C-m && \
    tmux split-window -h -p 45 -c "$DIR" && \
    tmux send-keys "nvim" C-m && \
    tmux split-window -v -p 50 -c "$DIR" && \
    tmux select-pane -t 0 || true'

bind w new-window -n "$(basename #{pane_current_path})" -c "#{pane_current_path}"

# Popup terminal
bind P display-popup -E -w 80% -h 80% -d "#{pane_current_path}"

# Pane sync toggle (send input to all panes)
bind S setw synchronize-panes

# Session management
bind N command-prompt -p "New session name:" "new-session -s '%%' -c '#{pane_current_path}'"
bind C-d command-prompt -p "New session directory:" "new-session -s '%%' -c '%%'"

# Reload tmux config
bind R source-file ~/.tmux.conf \; display-message "Reloaded!"

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
